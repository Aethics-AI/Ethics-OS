# Documentation site.
#
# Build:  pip install -e ".[docs]" && mkdocs serve

site_name: aethics-eval
site_description: Reproducible bias and safety evaluation for language models.
repo_url: https://github.com/Aethics-AI/Ethics-OS
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
  palette:
    # Respect the reader's system setting, with a manual toggle either way.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  # Admonitions carry most of the honesty caveats in these docs, so they are
  # not optional decoration.
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  # attr_list + md_in_html are what make the card grid on the home page render
  # as cards rather than as literal markdown. Removing either breaks it
  # silently — the page still builds, it just looks wrong.
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started:
      - Quickstart: quickstart.md
      - Model providers: model-providers.md
  - Guides:
      - Writing a task: writing-a-task.md
  - Reference:
      - Methodology: methodology.md
      - Aggregation: aggregation.md
      - Result schema: result-schema.md
      - Schema compatibility: result-schema-compatibility.md
      - Datasets: datasets.md
      - Claims register: CLAIMS.md
      - FAQ: faq.md
  - Maintainers:
      - Releasing: releasing.md
